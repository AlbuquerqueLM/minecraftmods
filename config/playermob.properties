# PlayerMob configuration.
#
# echoFriendChance: chance (0.0-1.0) that a Dungeon-Train echo which had logged
#   friends also brings back a friend-echo of one of them. Default 0.4.
# debugSpawnLog: when true, broadcasts a colour-coded chat message (and logs a line)
#   on every Dungeon-Train PlayerMob auto-spawn — yellow=friend, purple=echo,
#   green=echo+friend. Default false.
# trainDigThrough: when true, a PlayerMob riding a Dungeon Train mines soft fill
#   (ice, dirt, mud, moss, logs) blocking its march once it's stuck against it, to
#   pass through a packed carriage. Default true.
# trainFollowLovedPlayer: when true, a PlayerMob on a Dungeon Train that loves a player
#   aboard the same train abandons its fixed march to head to that player's carriage,
#   idling once it's in the same carriage. Default true.
# requireArrows: when true, a PlayerMob only fires a bow/crossbow if it carries ammo it can
#   use (arrows for bows; arrows or firework rockets for crossbows), consuming one per shot
#   and falling back to melee when empty. Set false for global unlimited ammo. Toggle live
#   with /playermob unlimitedammo on|off (session override). Default true.
# seekArrowsWhenEmpty: when true, a PlayerMob out of arrows mid-fight walks to a nearby
#   dropped arrow to restock (only if the enemy isn't too close), otherwise it closes to
#   melee. No effect when requireArrows=false. Default true.
# rangedEngageDistance / meleeEngageDistance: a PlayerMob prefers a ranged weapon beyond
#   rangedEngageDistance blocks and melee within meleeEngageDistance blocks (the band
#   between is hysteresis). meleeEngageDistance must be > 0 and < rangedEngageDistance,
#   else both reset to 8 / 4. Defaults 8.0 / 4.0.
# tntCombat: when true, a PlayerMob carrying TNT and a way to light it (flint & steel, fire
#   charge, redstone block, lever, button, or pressure plate) runs up to its target, drops a
#   TNT block, lights it, and sprints clear — repeating until out of TNT, then reverting to
#   normal bow/melee combat. Also requires the mobGriefing gamerule (it places + primes real
#   TNT). Toggle live with /playermob tntcombat on|off (session override). Default true.
# endCrystalCombat: when true, a PlayerMob carrying end crystals, obsidian (for the crystal's
#   base), and solid blocks (for cover) bombs its target with end crystals: it seats a crystal on
#   an obsidian base, stacks a 2-block-tall cover between itself and the crystal, crouches behind
#   it (raising a shield if it has one), and punches the crystal to detonate it — repeating until
#   out of the kit, then reverting to normal bow/melee combat. Also requires the mobGriefing
#   gamerule (it places blocks + triggers real explosions). Toggle live with
#   /playermob endcrystalcombat on|off (session override). Default true.
# flintAndSteelCombat: when true, a PlayerMob carrying flint and steel uses it like a player
#   would. Hunting: it lights the block a food animal is standing on just before the killing
#   blow, so the animal dies burning and the meat drops cooked, then stamps that fire out a
#   moment later. Combat: against anything not already on fire it occasionally torches the
#   ground under its target and leaves it burning, at most 5 lights per 10 seconds. Also
#   requires the mobGriefing gamerule (it places a real fire block). Toggle live with
#   /playermob flintcombat on|off (session override). Default true.
# extinguishWithBucket: when true, a PlayerMob that catches fire while holding a water
#   bucket empties it onto the ground, jumps in to douse itself, then a short while after
#   the fire is out scoops the water back into the bucket. Toggle live with
#   /playermob extinguishwithbucket on|off (session override). Default true.
# douseFires: when true, a PlayerMob walking toward a fire block usually notices it, stops
#   short, hesitates a beat and puts it out — punching it out bare-handed, or emptying a
#   water bucket on it and scooping the water back if it carries one. Deliberately
#   fallible: it misses roughly one fire in four and walks straight in, then runs for
#   water as usual. Applies to fire it lit itself too. Toggle live with
#   /playermob dousefires on|off (session override). Default true.
# huntForFood: when true, a hungry PlayerMob (no food carried, or hurt and low on carried
#   nutrition) hunts a nearby adult food animal (cow, pig, chicken, sheep, rabbit) as its
#   attack target, letting its weapon do the kill, then eats the drops. Set false to leave
#   animals alone entirely. Toggle live with /playermob huntforfood on|off (session
#   override). Default true.
# activityAnimations: when true, a PlayerMob shows what it is up to — arms reaching at a
#   small floating panel — while it loots a container, right after it changes its own
#   gear out of combat, and during idle bag-checks. Cosmetic only. Toggle live with
#   /playermob activityanimations on|off (session override). Default true.
# idleInventorySeconds: average seconds between a resting PlayerMob's idle bag-checks
#   (each lasts 2-5 seconds). 0 = never. Clamped to 0-3600. Set live with
#   /playermob idleinventory <seconds> (session override). Default 45.
# exactNames: when true, a /playermob subcommand whose <name> argument matches no
#   loaded PlayerMob is cancelled with an error, instead of falling back to the nearest
#   PlayerMob. Turn it on when orders are issued by automation (chat bots, command
#   blocks) and a stale or misspelled name must never command the wrong mob. Toggle live
#   with /playermob exactnames on|off (session override). Default false.
# orderFailureMessages: when true, a /playermob order that cannot run says why in chat
#   (no mob by that name, no such target, the mob lacks the weapon). Set false to cancel
#   such orders silently — useful when orders come from automation and the failures are
#   chat noise nobody can act on. Success messages are unaffected. Toggle live with
#   /playermob orderfailures on|off (session override). Default true.
# searchContainers / searchArmorStands / collectFloorItems: whether PlayerMobs scavenge —
#   searchContainers covers walking to nearby chests, barrels and shulker boxes, opening them
#   and swapping in better gear; searchArmorStands covers stripping gear off armor stands;
#   collectFloorItems covers picking wanted items up off the ground. Each is one of:
#     enabled                — every PlayerMob does it (default)
#     disabled               — none do
#     onlynaturallyspawning  — only mobs that arrived on their own (wild / chunk-generation /
#                              mob-spawner spawns and Dungeon-Train events); mobs you placed
#                              with a spawn egg, /summon or a dispenser leave your stuff alone
#   PlayerMobs already in your world from before this setting existed count as naturally
#   spawned. All three still require the mobGriefing gamerule. Toggle live with
#   /playermob searchcontainers|searcharmorstands|collectflooritems <mode> (session override).
# extraPickupItems: extra items the mob ALWAYS picks up (off the floor and out of chests)
#   and hoards in its backpack, beyond the built-in weapons/armor/ammo/valuables/food it
#   already grabs. List item ids and/or item tags, separated by commas or spaces. Prefix a
#   tag with #; a bare path with no namespace assumes minecraft. Empty by default.
#   Example: extraPickupItems=#scguns:ammo, scguns:assault_rifle, minecraft:diamond_block
# moddedRangedWeapons: firearms from other mods a PlayerMob should treat as ranged weapons
#   (not just vanilla bows/crossbows) — it draws them at range, reloads them over time, and
#   fires them with the mod's own logic (real bullets, real ammo). Comma-separated entries;
#   each binds a weapon to its ammo with '>', with an optional third field for the reload
#   time in ticks: weapon>ammo>reloadTicks. Each side is an item id or a #-prefixed item tag
#   (bare path assumes minecraft), and a side may list several ids/tags separated by spaces
#   to share one ammo. The mob must carry the ammo to fire (like arrows for a bow). Empty by
#   default. Example covering every MusketMod firearm with one cartridge binding:
#   moddedRangedWeapons=musketmod:musket musketmod:musket_with_bayonet musketmod:musket_with_scope musketmod:blunderbuss musketmod:pistol>musketmod:cartridge
# skinSourceBundled / skinSourceOnline / skinSourceLocal: which skin sources a random
#   PlayerMob may draw from. bundled = the built-in default skins; online = datapack /
#   by-name / external-mod skins; local = PNG files you drop in config/playermob/skins.
#   All on by default. Bundled is always the fallback when no other source has any skin.
#   Toggle live with /playermob skin source <bundled|online|local> on|off (session override).
# customSkinChance: chance (0.0-1.0) a spawning PlayerMob overrides its bundled (vanilla
#   default) base look with a custom skin drawn from the online + local pool. 0.0 = always
#   a bundled default; 1.0 = always custom when a custom skin is available (a mob with no
#   custom skin available keeps its bundled look regardless). Toggle live with
#   /playermob skin chance <0.0-1.0> (session override). Default 0.4.
# reincarnationDifficultyIsolation: when true (default), a past life is only ever
#   reincarnated on the vanilla difficulty it was lived on — echoes of a Hard run stay in
#   Hard, Peaceful in Peaceful. Lives logged before this existed count as normal. Set false
#   to pool every difficulty together, as older builds did.
# echoDraftBooks: when true (default), a player who dies holding an unsigned book & quill
#   with writing in it passes that draft to a local echo of theirs — kept apart from the
#   echo's 8-slot pack, dropped when the echo dies, and its first gift to the author once it
#   loves them. Blank and signed books are untouched; remote (relay) echoes never carry them.
echoFriendChance=0.4
reincarnationDifficultyIsolation=true
echoDraftBooks=true
debugSpawnLog=false
trainDigThrough=true
trainFollowLovedPlayer=true
requireArrows=true
seekArrowsWhenEmpty=true
rangedEngageDistance=8.0
meleeEngageDistance=4.0
tntCombat=true
endCrystalCombat=true
flintAndSteelCombat=true
extinguishWithBucket=true
douseFires=true
huntForFood=true
activityAnimations=true
idleInventorySeconds=45
exactNames=false
orderFailureMessages=true
searchContainers=enabled
searchArmorStands=enabled
collectFloorItems=enabled
extraPickupItems=
moddedRangedWeapons=
skinSourceBundled=true
skinSourceOnline=true
skinSourceLocal=true
customSkinChance=0.4
#
# --- Natural spawning (opt-in) ------------------------------------------------
# naturalSpawnEnabled: master switch. When false (default), PlayerMobs only appear
#   via spawn egg, /summon, or Dungeon Train — never naturally. Set true to let the
#   per-mob chances below take effect.
#
# autoNameMode: which spawns get a nameplate from their skin source — the local-folder
#   filename (no extension) for a local skin, or the displayName for an online / registry
#   skin (a bundled default skin has no source name and stays unnamed). One of:
#     off     — never (default)
#     natural — only natural / chunk-generation spawns
#     egg     — only spawn eggs, mob spawners, /summon, and dispensers
#     all     — every spawn except Dungeon-Train events (which keep their own naming)
#   /playermob summon <name|file> labels with that name once its skin loads (unless 'named'
#   was given, which always wins). Toggle live with /playermob autoname <off|natural|egg|all>
#   (session override).
#
# naturalSpawnScale.<id>: chance (0.0-1.0) that, when that mob spawns naturally, a
#   PlayerMob ALSO spawns beside it (additive — the mob is NOT replaced). 0.0 = never;
#   1.0 = always. Each line below defaults to its group's chance:
#     Hostile 0.0   Nether 0.05   Animals 0.15   Friendly 0.15   Water 0.0   Villager 0.25
#   Edit individual lines, or set a whole group live with
#   /playermob naturalspawn group <group> <chance>. Delete a line to fall back to its
#   group default. Only takes effect while naturalSpawnEnabled=true.
naturalSpawnEnabled=false
autoNameMode=off
# --- Hostile (0.0) ---
naturalSpawnScale.minecraft:zombie=0.0
naturalSpawnScale.minecraft:zombie_villager=0.0
naturalSpawnScale.minecraft:husk=0.0
naturalSpawnScale.minecraft:drowned=0.0
naturalSpawnScale.minecraft:skeleton=0.0
